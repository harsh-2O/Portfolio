# Hourly scan via GitHub Actions (Vercel Hobby only allows daily crons).
name: Internship scan

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server-side internship scan
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.INTERNSHIP_SCAN_URL }}"
